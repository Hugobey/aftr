<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join on Aftr</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #000; color: #fff;
      font-family: -apple-system, system-ui, sans-serif; text-align: center;
      padding: 24px;
    }
    h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
    p { color: #888; line-height: 1.5; max-width: 320px; margin: 12px auto 28px; }
    a {
      display: inline-block; background: #c8f560; color: #000; text-decoration: none;
      font-weight: 900; padding: 16px 28px; letter-spacing: 0.05em;
    }
    .code { color: #666; font-size: 13px; margin-top: 24px; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <div>
    <h1>JOIN THIS DUMP</h1>
    <p>Get Aftr to open the dump and add your POV.</p>
    <a id="store" href="#">GET AFTR</a>
    <p class="code" id="codeLabel"></p>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var code = params.get('code') || (location.pathname.split('/').pop() || '');
    if (code === 'join' || code === 'join.html') code = '';
    document.getElementById('codeLabel').textContent = code
      ? 'CODE ' + code.toUpperCase()
      : '';

    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);

    // Replace when apps are live
    var APP_STORE = 'https://apps.apple.com/app/idXXXXXXXX';
    var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.squadflix.aftr';
    var FALLBACK = 'https://joinaftr.app';

    var store = document.getElementById('store');
    if (isIOS) store.href = APP_STORE;
    else if (isAndroid) store.href = PLAY_STORE;
    else store.href = FALLBACK;

    // Optional later: try custom scheme then fall back
    // var scheme = 'aftr://join/' + encodeURIComponent(code);
    // window.location = scheme;
    // setTimeout(function () { window.location = store.href; }, 800);
  </script>
</body>
</html>
